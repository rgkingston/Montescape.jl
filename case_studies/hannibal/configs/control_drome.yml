# Hannibal case study — Drome route.
# Scenario: CONTROL. Pure terrain baseline (Pandolf army cost function,
# plus TRI + aspect). No elephant-specific layers, no ambush.
# Answers: "what would any Pandolf-army movement model predict here?"
project:
  name: control_drome
  output_dir: /scratch/$USER/outputs
  run_id: auto
  seed: 42

analysis:
  pass_buffer_m: 2000.0

data:
  dem_raster: case_studies/hannibal/testrunfiles/FABDEM_Elevation_UTM32N_90m.tif
  sites_vector: case_studies/hannibal/testrunfiles/sites.gpkg
  site_name_field: name
  passes_vector: case_studies/hannibal/testrunfiles/passes.gpkg

grid:
  resolution_m: 90
  snap_to: dem

endpoints:
  - name: control_drome_to_turin
    source_name: Drome_Rhone_Confluence
    ground_name: Turin
    buffer_m: 1000
    waypoints: []

friction:
  output_name: friction_surface.tif
  mode: build
  prebuilt_path: null
  custom_layer_files: []
  slope:
    enabled: true
    method: pandolf
    weight: 0.75
    body_weight_kg: 80.0
    load_kg: 30.0
    terrain_factor: 1.5
    speed_ms: 1.0
  tri:
    enabled: true
    weight: 0.15
  aspect:
    enabled: true
    weight: 0.10
    preferred_direction: 180
  vegetation:
    enabled: false
    weight: 0.0
  hydrology:
    enabled: false
    weight: 0.0
  custom_layers: []

lcp:
  enabled: true
  knight: true

lcc:
  enabled: true
  threshold:
    method: percent
    value: 5.0
  export_vector: true

circuitscape:
  enabled: true
  scenario: advanced
  julia_threads: 4
  connect_four_neighbors_only: false
  use_average_resistances: true
  use_unit_currents: true
  use_direct_grounds: true
  write_cur_maps: true
  write_volt_maps: false
  log_transform_maps: false

monte_carlo:
  enabled: true
  n_runs: 500
  n_workers: 64
  sampling: dirichlet
  dirichlet_concentration: 6.0
  seed: 42
  dem_error:
    enabled: true
    dem_profile: FABDEM
    error_m: 2.5
    correlation_length_m: 120.0
    method: smoothed_gaussian
  vary_weights: {}
  analyses: [lcp, lcc, circuitscape]
  sensitivity:
    morris: true
    morris_trajectories: 10
    morris_levels: 4
  aggregate:
    probability_surface: true
    mean_current: true
    confidence_interval: 0.95
